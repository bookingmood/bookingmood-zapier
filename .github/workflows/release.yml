# Pushes the version in package.json to Zapier when a matching tag, such as
# v2.0.0, is pushed. Promoting the version to users and migrating existing Zaps
# stay manual, see the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zapier
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
