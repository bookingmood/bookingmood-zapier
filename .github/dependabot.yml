# Zapier retires old platform and Node versions, so keep zapier-platform-* current
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      zapier:
        patterns: ["zapier-platform-*"]
    ignore:
      # Matches the Node version Zapier runs the integration on
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
